<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置 / 数据源 · PAPER</title>
<style>
:root{--pk:#ff4fb4;--card:#111116;--ln:#24242c;--txt:#ececf1;--mut:#8a8a99;--g:#3dff8f;--r:#ff4d5e;--y:#ffd23f;--c:#3fd5ff}*{box-sizing:border-box}html,body{margin:0;min-width:0}
body{background:#e04aa6;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:6px 6px;color:var(--txt);font-family:ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;padding:10px 12px;overflow-x:hidden}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:10px;min-width:0}.lg{width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:#111;display:grid;place-items:center}.hd h1{margin:0;font:900 26px/1 system-ui,sans-serif;color:#111}.sub{font-size:11px;color:#2a0b1e;letter-spacing:1px}.paper{background:#111;color:var(--y);font-size:10px;font-weight:900;padding:3px 7px;border-radius:4px;letter-spacing:1px;white-space:nowrap}.sp{flex:1}.title{font:900 20px system-ui,sans-serif;color:#111;white-space:nowrap}
#roomnav{display:flex;gap:4px;align-items:center;min-width:0;margin-left:10px}#roomnav a{color:#2a0b1e;text-decoration:none;font:800 12px ui-monospace,monospace;padding:4px 9px;border:2px solid #111;border-radius:5px;letter-spacing:1px;white-space:nowrap}#roomnav a.on{background:#111;color:var(--pk)}#roomnav a:hover{background:#111;color:#fff}#langBtn{background:#111;color:var(--y);border:2px solid #111;border-radius:5px;font:800 12px ui-monospace,monospace;padding:4px 9px;cursor:pointer}
.pn{background:var(--card);border-radius:7px;padding:14px;box-shadow:0 2px 0 rgba(0,0,0,.35);min-width:0;margin-bottom:8px}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.hero h2{font:900 22px/1.2 system-ui,sans-serif;color:var(--txt);margin:0 0 5px}.hero p{font:12px/1.6 system-ui,sans-serif;color:var(--mut);margin:0}.badge{display:inline-flex;gap:6px;align-items:center;border:1px solid #6c5620;border-radius:4px;background:#211b0d;color:var(--y);font-size:10px;font-weight:800;letter-spacing:.5px;padding:5px 8px}.section-title{font-size:11px;letter-spacing:1.2px;color:#d6d6e0;margin:0 0 10px}.rows{display:grid;gap:0}.row{display:grid;grid-template-columns:minmax(145px,.8fr) minmax(120px,1fr) minmax(140px,1.2fr);gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--ln);font-size:11px}.row:first-child{border-top:0}.key{color:var(--mut)}.value{color:var(--txt);font-weight:700}.detail{color:var(--mut);line-height:1.5}.pill{display:inline-block;color:var(--y);border:1px solid #5c4b23;border-radius:4px;padding:3px 6px;font-size:9px}.note{font:12px/1.65 system-ui,sans-serif;color:#c7c7d0}.notice{border-left:3px solid var(--y);background:#17140c;padding:10px 12px;border-radius:0 5px 5px 0;color:#d9d2bc;font:12px/1.65 system-ui,sans-serif}.back{display:inline-block;margin-top:8px;color:var(--c);font-size:11px;text-decoration:none}.back:hover{text-decoration:underline}.foot{font-size:10px;line-height:1.6;color:var(--mut);margin:8px 2px}
@media(max-width:768px){.hd{flex-wrap:wrap;gap:8px}.sp{display:none}.title{font-size:16px;margin-left:auto}#roomnav{order:10;flex:1 1 100%;width:100%;max-width:100%;margin:0;overflow-x:auto;white-space:nowrap;scrollbar-width:thin}#roomnav a,#langBtn{flex:none}}
@media(max-width:600px){body{padding:7px}.hd h1{font-size:22px}.sub{font-size:9px;letter-spacing:.5px}.paper{font-size:9px}#roomnav{flex:1 1 0%;min-width:0;gap:3px}#roomnav a,#langBtn{font-size:11px;padding:4px 7px}.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;padding:9px 0}.detail{grid-column:1/-1}.pn{padding:11px}.hero h2{font-size:19px}}
@media(max-width:390px){#roomnav{gap:2px!important}.row{font-size:10px}}
</style></head><body>
<div class="hd"><div class="lg"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="#ff4fb4"/><rect x="6" y="8" width="3" height="4" fill="#111"/><rect x="13" y="8" width="3" height="4" fill="#111"/></svg></div><div><h1>GROKBOT + JEV</h1><div class="sub" id="hsub"></div></div><span class="paper" id="hpaper"></span><nav id="roomnav"><a href="index.html" id="nOffice"></a><a href="trade.html" id="nTrade"></a><a href="markets.html" id="nMarkets"></a><a href="race.html" id="nRace"></a><a href="spider.html" id="nSpider"></a><a href="finance-observatory.html" id="nObservatory"></a><a href="settings.html" class="on" id="nSettings"></a><button id="langBtn"></button></nav><div class="sp"></div><div class="title" id="pageTitle"></div></div>
<section class="pn hero"><div><h2 id="heading"></h2><p id="lede"></p></div><span class="badge" id="state"></span></section>
<section class="pn"><h3 class="section-title" id="providerTitle"></h3><div class="rows" id="providers"></div></section>
<section class="pn"><h3 class="section-title" id="timingTitle"></h3><div class="rows" id="timings"></div></section>
<section class="pn"><div class="notice" id="securityNote"></div><div class="note" id="note" style="margin-top:10px"></div><a class="back" href="finance-observatory.html" id="back"></a></section>
<div class="foot" id="footer"></div>
<script>
const LANG=(()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q==='zh'||q==='en')return q}catch(e){}try{return localStorage.getItem('office_lang')||'zh'}catch(e){return'zh'}})();
const D={zh:{sub:'模拟股票桌面 · 行情与组合',paper:'📄 PAPER · 虚拟资金',office:'办公室',trade:'交易台',markets:'行情',race:'赛跑',spider:'蜘蛛',observatory:'财经观测台',settings:'设置',page:'设置 / 数据源',heading:'数据源与刷新状态',lede:'只读占位页 · 不读取或保存私密凭据，也不修改服务器配置。',state:'公开 DEMO · 已禁用',providerTitle:'数据提供方状态',timingTitle:'刷新与过期策略',providerRows:[['行情报价','未接入','公开 DEMO 不请求实时行情。'],['财经新闻 / 公司公告','未接入','公开 DEMO 不请求外部新闻源。'],['财经观测台','本地 DEMO fixture','仅显示明确标注的合成样例。'],['Spider 事件流','仅接受 DEMO','只读取观测台 demo:true 内容；不把 Spider 当采集源。']],timingRows:[['行情刷新间隔','不适用','公开 DEMO 未启用实时行情。'],['新闻刷新间隔','不适用','公开 DEMO 未启用外部新闻流。'],['报价过期阈值','未公开','正式值需后端服务策略明确提供。'],['新闻陈旧阈值','未公开','新闻收录与事件时间应分别追踪。']],security:'私有模式可配置 / 此公开 DEMO 已禁用。页面本身不提供密码保护，也不接受密钥或密码输入；真实配置变更须由后端授权。',note:'页面没有 API key、token、密码或保存按钮；所有信息为非秘密状态占位。此入口不会发出配置写请求。',back:'← 返回财经观测台',footer:'配置能力、身份验证与保存流程尚未在本占位页实现；不要将本页当作安全边界。'},
en:{sub:'PAPER STOCK DESK · MARKETS & PORTFOLIO',paper:'📄 PAPER · VIRTUAL MONEY',office:'Office',trade:'Trade Desk',markets:'Markets',race:'Race',spider:'Spider',observatory:'Observatory',settings:'Settings',page:'SETTINGS / DATA SOURCES',heading:'Provider & refresh status',lede:'Read-only placeholder — does not read secrets or modify server configuration.',state:'PUBLIC DEMO · DISABLED',providerTitle:'PROVIDER STATUS',timingTitle:'REFRESH & STALENESS POLICY',providerRows:[['Market quotes','Not connected','Public demo does not request live quotes.'],['Finance news / notices','Not connected','Public demo does not request external news feeds.'],['Financial observatory','Local DEMO fixture','Synthetic samples are explicitly labeled.'],['Spider event feed','DEMO only','Reads only observatory demo:true items; Spider is not a collector.']],timingRows:[['Quote refresh interval','N/A','Live quotes are disabled in public demo.'],['News refresh interval','N/A','External news feeds are disabled in public demo.'],['Quote stale threshold','Not exposed','Production policy must be supplied by the authorized backend.'],['News stale threshold','Not exposed','Event time and ingestion time must be tracked separately.']],security:'Configurable in private mode / disabled in this public DEMO. This page itself does not implement password protection and has no credential fields; real configuration changes require backend authorization.',note:'No API keys, tokens, passwords, or save controls are present. This entry makes no configuration write requests.',back:'← Back to Financial Observatory',footer:'Authentication, configuration changes, and persistence are not implemented here. Do not treat this placeholder as a security boundary.'}};
const T=D[LANG];document.documentElement.lang=LANG==='zh'?'zh-CN':'en';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('hsub').textContent=T.sub;$('hpaper').textContent=T.paper;$('pageTitle').textContent=T.page;$('heading').textContent=T.heading;$('lede').textContent=T.lede;$('state').textContent=T.state;$('providerTitle').textContent=T.providerTitle;$('timingTitle').textContent=T.timingTitle;$('securityNote').textContent=T.security;$('note').textContent=T.note;$('back').textContent=T.back;$('footer').textContent=T.footer;
for(const [id,key] of [['nOffice','office'],['nTrade','trade'],['nMarkets','markets'],['nRace','race'],['nSpider','spider'],['nObservatory','observatory'],['nSettings','settings']])$(id).textContent=T[key];$('langBtn').textContent=LANG==='zh'?'EN':'中文';$('langBtn').onclick=()=>{try{localStorage.setItem('office_lang',LANG==='zh'?'en':'zh')}catch(e){}location.href=location.pathname+'?lang='+(LANG==='zh'?'en':'zh')};
function rows(data){return data.map(([key,value,detail])=>`<div class="row"><span class="key">${esc(key)}</span><span class="value">${esc(value)} <span class="pill">${T.state}</span></span><span class="detail">${esc(detail)}</span></div>`).join('')}$('providers').innerHTML=rows(T.providerRows);$('timings').innerHTML=rows(T.timingRows);
</script><script src="/app/back-to-top.js"></script>
