setInterval(()=>S&&cards(),15000);cards();scale();load();setInterval(load,POLL);
function applyStatic(){const M={hsub:'sub',hpaper:'paper',hSaldo:'saldo',hJev:'jev',hThrNote:'thr_note',hFailClosed:'fail_closed',hAutoPre:'th_autopre',hVeto:'th_veto',rn_office:'nav_office',rn_trade:'nav_trade',rn_markets:'nav_markets',rn_race:'nav_race',rn_spider:'nav_spider',rn_observatory:'nav_observatory',rn_settings:'nav_settings'};for(const id in M){const e=$(id);if(e&&TI[M[id]])e.textContent=TI[M[id]]}const lb=$('langBtn');if(lb){lb.textContent=LANG==='zh'?'EN':'中文';lb.onclick=()=>{try{localStorage.setItem('office_lang',LANG==='zh'?'en':'zh')}catch(e){}location.reload()}}}
applyStatic();
const CSYM={CNY:'¥',HKD:'HK$',USD:'$'};
async function stockTick(){const el=$('stockchip');if(!el)return;try{const a=await(await fetch('/api/trade/account')).json();const o=await(await fetch('/api/trade/orders')).json();const eq=(a.accounts||[]).map(x=>(CSYM[x.currency]||'')+f2(x.equity,0)).join(' · ');const os=o.orders||[];const last=os.find(x=>x.status==='filled')||os[0];el.innerHTML='<b>📈 '+(TI.stocks||'STOCKS')+'</b> · '+(TI.stocks_paper||'PAPER')+'<br>'+eq+(last?'<br><span class="mut">'+(TI.stocks_last||'last')+':</span> '+(last.side==='buy'?(LANG==='zh'?'买':'BUY'):(LANG==='zh'?'卖':'SELL'))+' '+esc(last.symbol)+' ×'+last.qty+(last.fill_price?' @'+last.fill_price:''):'<br><span class="mut">'+(TI.stocks_none||'—')+'</span>')}catch(e){el.style.display='none'}}
stockTick();setInterval(stockTick,20000);
async function aiTick(){const el=$('aichip');if(!el)return;try{const d=await(await fetch('/api/ai/status')).json();const cfg=d.config||{},st=d.status||{};const evs=st.events||[];const last=evs[evs.length-1];
const head='<b>🤖 '+(LANG==='zh'?'AI 炒股小队':'AI CREW')+'</b> · '+(cfg.enabled?(d.running?(LANG==='zh'?'运行中':'LIVE'):(LANG==='zh'?'引擎未运行':'ENGINE OFF')):(LANG==='zh'?'未启用':'OFF'));
el.innerHTML=head+(last?'<br><span style="color:#ffd23f">'+esc(last.persona)+'</span> '+esc(String(last.text).slice(0,66)):'<br><span class="mut">'+(LANG==='zh'?'去交易台开启 →':'enable in Trade Desk →')+'</span>');
el.onclick=()=>location.href='trade.html';}catch(e){el.style.display='none'}}
aiTick();setInterval(aiTick,20000);
})();
