function maArr(ks,n){const o=[];let s=0;for(let i=0;i<ks.length;i++){s+=ks[i].close;if(i>=n)s-=ks[i-n].close;o.push(i>=n-1?s/n:null)}return o}
function drawK(hover){const c=$('kc'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);const ks=KS;if(ks.length<2)return;
 let lo=Math.min(...ks.map(k=>k.low)),hi=Math.max(...ks.map(k=>k.high));if(hi-lo<1e-9){hi+=1;lo-=1}
 const W=c.width,H=c.height,PH=Math.round(H*0.78),P=22,bw=W/ks.length,Y=v=>PH-P-(v-lo)/(hi-lo)*(PH-2*P),vmax=Math.max(...ks.map(k=>k.volume||0))||1;
 x.strokeStyle='#24242c';x.beginPath();for(let i=1;i<4;i++){x.moveTo(0,PH*i/4);x.lineTo(W,PH*i/4)}x.stroke();
 ks.forEach((k,i)=>{const up=k.close>=k.open,col=up?'#3dff8f':'#ff4d5e',cx=i*bw+bw/2;
  x.fillStyle=col;x.globalAlpha=.55;const vh=(k.volume||0)/vmax*(H-PH-14);x.fillRect(i*bw+1,H-vh,Math.max(1,bw-2),vh);x.globalAlpha=1;
  x.strokeStyle=col;x.beginPath();x.moveTo(cx,Y(k.high));x.lineTo(cx,Y(k.low));x.stroke();const a=Y(Math.max(k.open,k.close)),b2=Y(Math.min(k.open,k.close));x.fillStyle=col;x.fillRect(i*bw+1,a,Math.max(1,bw-2),Math.max(1,b2-a))});
 const line=(arr,col)=>{x.strokeStyle=col;x.lineWidth=1.2;x.beginPath();let st=false;arr.forEach((v,i)=>{if(v==null)return;const cx=i*bw+bw/2,cy=Y(v);if(!st){x.moveTo(cx,cy);st=true}else x.lineTo(cx,cy)});x.stroke();x.lineWidth=1};
 line(maArr(ks,5),'#ffd23f');line(maArr(ks,20),'#3fd5ff');
 const lp=ks[ks.length-1].close;x.strokeStyle='rgba(255,79,180,.6)';x.setLineDash([4,4]);x.beginPath();x.moveTo(0,Y(lp));x.lineTo(W,Y(lp));x.stroke();x.setLineDash([]);
 x.fillStyle='#8a8a99';x.font='11px ui-monospace,monospace';x.fillText(f2(hi),6,14);x.fillText(f2(lo),6,PH-6);x.fillText(ks[0].date+' → '+ks[ks.length-1].date,6,H-4);
 x.fillStyle='#ffd23f';x.fillText('MA5',W-118,14);x.fillStyle='#3fd5ff';x.fillText('MA20',W-76,14);
 if(hover!=null&&ks[hover]){const k=ks[hover],cx=hover*bw+bw/2;x.strokeStyle='rgba(236,236,241,.35)';x.beginPath();x.moveTo(cx,0);x.lineTo(cx,H);x.stroke();
  $('qmeta').textContent=`${k.date} · O ${f2(k.open)} · H ${f2(k.high)} · L ${f2(k.low)} · C ${f2(k.close)} · Vol ${k.volume?f2(k.volume,0):'—'}`}}

$('sq').addEventListener('keydown',e=>{if(e.key==='Enter'){const f=$('sres').querySelector('.srow[data-sym]');if(f)pickSearch(f.dataset.sym)}if(e.key==='Escape')$('sres').style.display='none'});
document.addEventListener('click',e=>{if(!$('swrap').contains(e.target))$('sres').style.display='none'});
async function loadSelQuote(){if(!SEL||WATCH.some(w=>w.symbol===SEL))return;$('qstatus').className='qstatus';$('qstatus').textContent=T.loading;try{const q=await J('/api/finance/quotes?symbols='+encodeURIComponent(SEL));(q.items||[]).forEach(x=>QUOTES[x.symbol]=x);paintQuote();est()}catch(e){$('qstatus').className='qstatus bad';$('qstatus').textContent=T.loadFail+': '+e.message;$('qmeta').textContent=T.noQuote}}
async function pickSearch(sym){$('sres').style.display='none';$('sq').value='';select(sym);loadSelQuote()}
loadMode();loadWatch().then(()=>loadTape());refresh();loadNews();
const PERSONAS={CHIEF:['#ff4fb4','拍板决策','Final calls'],SCAN:['#3f8cff','指标扫描','Indicator scan'],VET:['#ececf1','审查否决','Veto gate'],RISK:['#ff9a3c','风控闸门','Risk gates'],SOCIAL:['#ff4d5e','新闻舆情','News sentiment'],CRAWLER:['#3fd5ff','数据抓取','Data fetch'],FILLS:['#3dff8f','执行下单','Execution'],JOURNAL:['#ffd23f','复盘记录','Journal']};
$('hai').textContent=T.hai;$('ainote').textContent=T.aiNote;$('aicyc').textContent=T.aiMin;
document.querySelectorAll('#aiProf button').forEach(b=>b.textContent=({conservative:T.prof_cons,balanced:T.prof_bal,aggressive:T.prof_aggr})[b.dataset.p]||b.dataset.p);
let AICFG={enabled:false,profile:'balanced',cycle_min:10};
async function aiSet(patch){if(patch.enabled&&!AICFG.enabled&&!confirm(T.aiConfirm))return;try{const d=await J('/api/ai/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});AICFG=d.config||AICFG;loadAI()}catch(e){toast(e.message,0)}}
$('aiToggle').onclick=()=>aiSet({enabled:!AICFG.enabled});
document.querySelectorAll('#aiProf button').forEach(b=>b.onclick=()=>aiSet({profile:b.dataset.p}));
$('aiCycle').onchange=()=>aiSet({cycle_min:+$('aiCycle').value});
async function loadAI(){try{const d=await J('/api/ai/status');const cfg=d.config||{};AICFG=cfg;const st=d.status||{};
 $('aiToggle').textContent=cfg.enabled?T.aiOn:T.aiOff;$('aiToggle').style.background=cfg.enabled?'var(--r)':'var(--g)';$('aiToggle').style.color=cfg.enabled?'#fff':'#000';$('aiToggle').style.borderColor='transparent';
 document.querySelectorAll('#aiProf button').forEach(b=>b.classList.toggle('on',b.dataset.p===cfg.profile));
 $('aiCycle').value=String(cfg.cycle_min||10);
 $('aistate').textContent=!cfg.enabled?T.aiOffState:!d.running?T.aiNoEng:(T.aiRun+' · '+T.aiRound+(st.cycle||0)+T.aiRound2+(st.next_cycle_ts?' · '+T.aiNext+' '+new Date(st.next_cycle_ts*1000).toLocaleTimeString(LANG==='zh'?'zh-CN':'en-US',{hour:'2-digit',minute:'2-digit',hour12:false}):''));
 const evs=(st.events||[]).slice().reverse();
 $('aifeed').innerHTML=evs.length?evs.map(e=>{const P=PERSONAS[e.persona]||['#888',e.persona,''];const ic=e.kind==='buy'?'▲':e.kind==='sell'?'▼':e.kind==='veto'?'⛔':e.kind==='warn'?'⚠':'·';
 return`<div class="ai-ev"><span class="tm">${new Date(e.ts*1000).toLocaleTimeString(LANG==='zh'?'zh-CN':'en-US',{hour:'2-digit',minute:'2-digit',hour12:false})}</span><span class="pchip2" style="background:${P[0]}">${e.persona}</span><span class="${e.kind==='buy'?'pos':e.kind==='sell'?'neg':''}">${ic} ${esc(e.text)}</span></div>`}).join(''):'<span class="mut">—</span>';
 const pl=st.persona_last||{};
 $('aicrew').innerHTML=Object.keys(PERSONAS).map(k=>{const P=PERSONAS[k];const last=pl[k];
 return`<div class="ai-mem"><div class="nm" style="color:${P[0]}">${k} <span class="rl">· ${LANG==='zh'?P[1]:P[2]}</span></div><div class="la">${last?esc(last.text):'—'}</div></div>`}).join('');
 }catch(e){}}
loadAI();setInterval(loadAI,10000);
setInterval(()=>{loadWatch();refresh();loadSelQuote()},15000);setInterval(()=>{loadTape();loadNews();if(SEL)loadInd()},60000);
</script><script src="/app/back-to-top.js"></script>
</body></html>
