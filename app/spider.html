<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蜘蛛 · Spider</title>
<style>
:root{--pk:#ff4fb4;--card:#111116;--ln:#24242c;--txt:#ececf1;--mut:#8a8a99;--g:#3dff8f;--r:#ff4d5e;--y:#ffd23f;--c:#3fd5ff}
*{box-sizing:border-box}html,body{margin:0}
body{background:#e04aa6;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:6px 6px;color:var(--txt);font-family:ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;padding:10px 12px}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.hd .lg{width:34px;height:34px;border-radius:8px;background:#111;display:grid;place-items:center}
.hd h1{margin:0;font:900 26px/1 system-ui,sans-serif;color:#111}.hd .sub{font-size:11px;color:#2a0b1e;letter-spacing:1px}
.paper{background:#111;color:var(--y);font-size:10px;font-weight:900;padding:3px 7px;border-radius:4px;letter-spacing:1px}
#roomnav{display:flex;gap:4px;align-items:center;margin-left:10px}
#roomnav a{color:#2a0b1e;text-decoration:none;font:800 12px ui-monospace,monospace;padding:4px 9px;border:2px solid #111;border-radius:5px;letter-spacing:1px}
#roomnav a.on{background:#111;color:#ff4fb4}#roomnav a:hover{background:#111;color:#fff}
#langBtn{background:#111;color:#ffd23f;border:2px solid #111;border-radius:5px;font:800 12px ui-monospace,monospace;padding:4px 9px;cursor:pointer}
.hd .sp{flex:1}.hd .ttl{font:900 20px system-ui,sans-serif;color:#111}
.pn{background:var(--card);border-radius:7px;padding:10px 12px;box-shadow:0 2px 0 rgba(0,0,0,.35);margin-bottom:8px}
.ph{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1.5px;color:#d6d6e0}.ph b{color:var(--pk)}
.chip{display:inline-block;border:1px dashed #44445a;padding:3px 8px;border-radius:4px;color:#d6d6e0;font-size:11px;margin:3px 3px 0 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:6px}
iframe{width:100%;height:76vh;border:0;border-radius:7px;background:#0b0b0f;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.nrow{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px dashed #24242c;font-size:12.5px}
.nrow a{color:var(--txt);text-decoration:none}.nrow a:hover{color:var(--pk);text-decoration:underline}
.nrow span{white-space:nowrap;font-size:11px}
.stage-empty{display:none;min-height:240px;height:76vh;max-height:700px;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0b0b0f;border:2px solid #111;border-radius:7px;box-shadow:0 2px 0 rgba(0,0,0,.35);color:var(--txt)}.stage-empty .inner{max-width:480px}.stage-empty b{display:block;color:var(--pk);font:900 20px system-ui,sans-serif;margin-bottom:8px}.stage-empty .mut{font-size:12px;line-height:1.6}.retry{margin-top:12px;background:#111;color:var(--y);border:1px solid #4a2a3c;border-radius:4px;padding:6px 10px;font:700 11px ui-monospace,monospace;cursor:pointer}
.mut{color:var(--mut)}a{color:var(--c)}
@media(max-width:768px){body{padding:8px}.hd{flex-wrap:wrap;gap:8px}.hd .sp{display:none}.hd .ttl{font-size:16px;margin-left:auto}#roomnav{order:10;flex:1 0 100%;width:100%;max-width:100%;margin:0;overflow-x:auto;white-space:nowrap;scrollbar-width:thin}#roomnav a,#langBtn{flex:none}iframe{height:65vh}.nrow{align-items:flex-start}.nrow a{min-width:0;overflow-wrap:anywhere}}
@media(max-width:390px){body{padding:7px}.hd h1{font-size:22px}.hd .sub{font-size:9px;letter-spacing:.5px}.paper{font-size:9px}#roomnav{gap:3px}#roomnav a,#langBtn{font-size:11px;padding:4px 7px}iframe{height:58vh}.nrow{gap:6px;font-size:11px}.nrow span{font-size:10px}}
</style></head><body>
<div class="hd"><div class="lg"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="#ff4fb4"/><rect x="6" y="8" width="3" height="4" fill="#111"/><rect x="13" y="8" width="3" height="4" fill="#111"/></svg></div>
<div><h1>GROKBOT + JEV</h1><div class="sub" id="hsub"></div></div><span class="paper" id="hpaper"></span>
<nav id="roomnav"><a href="index.html" id="rn_office"></a><a href="trade.html" id="rn_trade"></a><a href="markets.html" id="rn_markets"></a><a href="race.html" id="rn_race"></a><a href="spider.html" class="on" id="rn_spider"></a><a href="finance-observatory.html" id="rn_observatory"></a><a href="settings.html" id="rn_settings"></a><button id="langBtn"></button></nav>
<div class="sp"></div><div class="ttl" id="httl"></div></div>
<div class="pn"><div class="ph"><span id="hstat"></span><b><a href="https://github.com/Kirito14IT/prompt-spider-ui" target="_blank" rel="noopener">Prompt Spider UI · MIT · © 2026 Kirito14IT</a></b> <a href="/public/spider-stage/LICENSE.txt" target="_blank" rel="noopener">LICENSE</a></div>
<div style="margin-top:6px;font-size:13px"><span class="dot" id="dot" style="background:var(--y)"></span><span id="stat">—</span></div>
<div class="mut" style="font-size:11.5px;margin-top:6px" id="hint"></div>
<div id="tools"></div></div>
<iframe id="stage" title="Prompt Spider 本地演示" loading="lazy"></iframe>
<div id="stageEmpty" class="stage-empty" role="status" aria-live="polite"><div class="inner"><b id="stageEmptyTitle">蜘蛛舞台离线</b><div class="mut" id="stageEmptyText">舞台服务当前没有响应；下方快讯列表仍可查看。</div><button class="retry" id="stageRetry" type="button">重新检查</button></div></div>
<div class="pn"><div class="ph"><span id="hnews"></span><b id="feedSource">DEMO</b></div><div id="newslist" style="margin-top:4px"></div></div>
<script>
const LANG=(()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q==='en'||q==='zh')return q}catch(e){}try{return localStorage.getItem('office_lang')||'zh'}catch(e){return'zh'}})();
const D={zh:{sub:'模拟股票桌面 · 行情与组合',paper:'📄 PAPER · 虚拟资金',office:'办公室',trade:'交易台',markets:'行情',race:'赛跑',spider:'蜘蛛',observatory:'财经观测台',settings:'设置',ttl:'机械蜘蛛工坊',stat:'舞台状态',feedOn:'财经 DEMO · 演示事件流已载入',feedHint:'仅使用 /api/finance/observatory 且要求 demo:true。标签类别/来源/事件与收录时间来自示例数据；蜘蛛只把标题做逐词动画，不是真实抓取、AI分析或交易。',stageOn:'同源本地舞台 · Prompt Spider UI（MIT）',stageLoading:'本地蜘蛛舞台正在加载…',feedEmpty:'财经 DEMO 当前没有事件；舞台显示 Prompt Spider 本地参考演示。',feedUnavailable:'财经观测台 DEMO feed 不可用；未加载实时行情或新闻。舞台仍显示 Prompt Spider 本地参考演示。',stageUnavailable:'同源蜘蛛舞台未能载入',retry:'重新检查',tools:'MCP 能力保持独立（modules/spider/mcp）',news:'财经事件流 · DEMO（最多5条）',noSource:'来源未提供',noTime:'未提供',noTitle:'无标题',category:'分类',source:'来源',publisher:'发布方',kindLabel:'事件类型',marketLabel:'市场',freshnessLabel:'时效',eventTime:'事件时间（UTC）',receivedTime:'收录时间（UTC）',summary:'摘要',noPublisher:'发布方未提供',noMarket:'市场未提供',noFreshness:'时效未提供',noKind:'类型未提供',macroMarket:'宏观 / 市场',topicWatch:'观察主题',notClassified:'未分类',macro:'宏观政策',market:'市场动态',company:'公司公告',eventLink:'原文',demoLink:'示例链接 / DEMO，未接入原文'},
en:{sub:'PAPER STOCK DESK · MARKETS & PORTFOLIO',paper:'📄 PAPER · VIRTUAL MONEY',office:'Office',trade:'Trade Desk',markets:'Markets',race:'Race',spider:'Spider',observatory:'Observatory',settings:'Settings',ttl:'SPIDER WORKSHOP',stat:'Stage status',feedOn:'FINANCE DEMO · sample event stream loaded',feedHint:'Uses only /api/finance/observatory and requires demo:true. Category/source/event/received times come from the sample payload; the spider animates headlines only—it does not fetch, analyze with AI, or trade.',stageOn:'Same-origin local stage · Prompt Spider UI (MIT)',stageLoading:'Loading the local Spider stage…',feedEmpty:'No Finance DEMO events. The stage is showing the local Prompt Spider reference demo.',feedUnavailable:'Finance Observatory DEMO feed unavailable; no live quotes or news were loaded. The local Prompt Spider reference demo remains.',stageUnavailable:'Same-origin Spider stage could not be loaded',retry:'Check again',tools:'MCP capability remains separate (modules/spider/mcp)',news:'Finance event stream · DEMO (up to 5)',noSource:'Source not provided',noTime:'Not provided',noTitle:'Untitled',category:'Category',source:'Provider',publisher:'Publisher',kindLabel:'Event type',marketLabel:'Market',freshnessLabel:'Freshness',eventTime:'Event time (UTC)',receivedTime:'Received (UTC)',summary:'Summary',noPublisher:'Publisher not provided',noMarket:'Market not provided',noFreshness:'Freshness not provided',noKind:'Type not provided',macroMarket:'Macro / market',topicWatch:'Topic watch',notClassified:'Unclassified',macro:'Macro & policy',market:'Market moves',company:'Company announcements',eventLink:'Source',demoLink:'DEMO link · source not connected'} };
const T=D[LANG];document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('hsub').textContent=T.sub;$('hpaper').textContent=T.paper;$('httl').textContent=T.ttl;$('hstat').textContent=T.stat;$('hnews').textContent=T.news;
['office','trade','markets','race','spider','observatory','settings'].forEach(k=>$('rn_'+k).textContent=T[k]);
$('langBtn').textContent=LANG==='zh'?'EN':'中文';$('langBtn').onclick=()=>{try{localStorage.setItem('office_lang',LANG==='zh'?'en':'zh')}catch(e){}location.href=location.pathname+'?lang='+(LANG==='zh'?'en':'zh')};
const TOOLS=['spider_create_session','spider_configure_session','spider_get_session','spider_list_sessions','spider_control_playback','spider_update_events','spider_report_task','spider_export_session','spider_export_project','spider_import_session','spider_complete_session','spider_close_session'];
$('tools').innerHTML='<div class="mut" style="font-size:11px;margin-top:8px">'+T.tools+'</div>'+TOOLS.map(t=>`<span class="chip">${t}</span>`).join('');
const stage=$('stage');let stageReady=false,demoItems=[],feedState='unavailable',lastPrompt='';
function categoryLabel(classification){const raw=String(classification||'').toLowerCase();if(raw==='policy_market_event')return T.macroMarket;if(/^policy|macro|政策|宏观/.test(raw))return T.macro;if(/^company|公司|公告|产业|财报/.test(raw))return T.company;if(/^market|index|指数|市场|异动|demo_quote/.test(raw))return T.market;if(raw==='topic_watch')return T.topicWatch;return T.notClassified}
function formatSupplied(v){if(v===null||v===undefined||v==='')return T.noTime;if(typeof v==='number'&&Number.isFinite(v))return new Date(v*1000).toLocaleString(LANG==='zh'?'zh-CN':'en-US',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});return String(v)}
function safeUrl(v){if(!v)return'';try{const u=new URL(String(v),location.origin);return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return''}}
function clip(v,n=160){return Array.from(String(v||'')).slice(0,n).join('')}
function promptFor(items){return items.map(x=>`${categoryLabel(x.topic)} · ${x.title||T.noTitle}${x.summary?' — '+clip(x.summary):''}`).join('\n')}
function renderEmpty(text){$('newslist').innerHTML=`<div class="mut" role="status" aria-live="polite">${esc(text)}</div>`}
function renderFeed(items){if(!items.length){renderEmpty(T.feedEmpty);return}const safe=items.slice(0,5);$('newslist').innerHTML=safe.map(x=>{const title=String(x.title||T.noTitle),url=safeUrl(x.url),canOpen=x.data_mode==='LIVE'&&x.link_authorized===true&&!!url,demoLink=x.data_mode==='DEMO'&&!!url,source=String(x.source||T.noSource),publisher=String(x.publisher||T.noPublisher),cat=categoryLabel(x.topic),kind=String(x.kind||T.noKind),market=String(x.market||T.noMarket),freshness=String(x.freshness||T.noFreshness),eventTime=formatSupplied(x.published),received=formatSupplied(x.received),summary=clip(x.summary);return`<article class="nrow" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><span class="chip">${esc(cat)}</span>${canOpen?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(T.eventLink)} ↗</a>`:demoLink?`<span class="mut">${esc(T.demoLink)}</span>`:''}</div><div style="margin-top:5px">${canOpen?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(title)}</a>`:esc(title)}</div>${summary?`<div class="mut" style="margin-top:4px;font-size:11px">${esc(T.summary)}：${esc(summary)}</div>`:''}<div class="mut" style="margin-top:4px;font-size:10.5px;white-space:normal;overflow-wrap:anywhere">${esc(T.kindLabel)}：${esc(kind)} · ${esc(T.marketLabel)}：${esc(market)} · ${esc(T.freshnessLabel)}：${esc(freshness)}<br>${esc(T.source)}：${esc(source)} · ${esc(T.publisher)}：${esc(publisher)}<br>${esc(T.eventTime)}：${esc(eventTime)} · ${esc(T.receivedTime)}：${esc(received)}</div></article>`}).join('')}
function applyDemoToStage(){try{const api=stage.contentWindow&&stage.contentWindow.spider;if(stageReady&&api&&typeof api.loadPrompt==='function'&&demoItems.length){const prompt=promptFor(demoItems);if(prompt!==lastPrompt){api.loadPrompt(prompt);api.play();lastPrompt=prompt}return true}}catch(e){}return false}
let stagePoll=null,stagePollStart=0;function stageLoaded(){stageReady=false;if(stagePoll){clearInterval(stagePoll);stagePoll=null}stage.style.display='block';$('stageEmpty').style.display='none';$('stat').textContent=T.stageLoading;$('hint').textContent=T.stageLoading;stagePollStart=Date.now();const checkReady=()=>{try{stageReady=!!(stage.contentWindow&&stage.contentWindow.spider&&typeof stage.contentWindow.spider.loadPrompt==='function')}catch(e){stageReady=false}if(stageReady){if(stagePoll){clearInterval(stagePoll);stagePoll=null}stage.style.display='block';$('stageEmpty').style.display='none';$('stat').textContent=demoItems.length?T.feedOn:feedState==='unavailable'?T.feedUnavailable:T.stageOn;$('hint').textContent=demoItems.length?T.feedHint:feedState==='unavailable'?T.feedUnavailable:T.feedEmpty;applyDemoToStage();return}if(Date.now()-stagePollStart>=5000){if(stagePoll){clearInterval(stagePoll);stagePoll=null}stage.style.display='block';$('stageEmptyTitle').textContent=T.stageUnavailable;$('stageEmptyText').textContent=T.stageUnavailable;$('stageEmpty').style.display='flex';$('stat').textContent=T.stageUnavailable;$('hint').textContent=T.stageUnavailable}};checkReady();if(!stageReady)stagePoll=setInterval(checkReady,100)}
function normalizeDemoEvent(x){if(!x||typeof x!=='object'||Array.isArray(x)||x.data_mode!=='DEMO')return null;const title=typeof x.headline==='string'&&x.headline.trim()?x.headline.trim():typeof x.title==='string'&&x.title.trim()?x.title.trim():'';if(!title)return null;return{title,summary:typeof x.summary==='string'?x.summary:'',source:typeof x.provider==='string'?x.provider:'',publisher:typeof x.publisher==='string'?x.publisher:'',topic:typeof x.classification==='string'?x.classification:'',kind:typeof x.kind==='string'?x.kind:'',market:typeof x.market==='string'?x.market:'',freshness:typeof x.freshness==='string'?x.freshness:'',published:typeof x.event_ts==='string'?x.event_ts:'',received:typeof x.received_at==='string'?x.received_at:'',url:typeof x.source_url==='string'?x.source_url:'',data_mode:typeof x.data_mode==='string'?x.data_mode:'',link_authorized:x.link_authorized===true}}
async function loadObservatoryDemo(){try{const r=await fetch('/api/finance/observatory',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!d||d.demo!==true||d.data_mode!=='DEMO'||!Array.isArray(d.items))throw Error('DEMO envelope with items[] required');if(d.items.some(x=>x&&x.data_mode&&x.data_mode!=='DEMO'))throw Error('non-DEMO item rejected');demoItems=d.items.map(normalizeDemoEvent).filter(Boolean).slice(0,5);feedState='available';renderFeed(demoItems);$('stat').textContent=demoItems.length?T.feedOn:T.feedEmpty;$('hint').textContent=demoItems.length?T.feedHint:T.feedEmpty;if(!applyDemoToStage()&&stageReady&&demoItems.length){$('stat').textContent=T.stageUnavailable}}catch(e){demoItems=[];feedState='unavailable';renderEmpty(T.feedUnavailable);$('stat').textContent=T.feedUnavailable;$('hint').textContent=T.feedUnavailable}}
function retry(){if(!stageReady){stage.src='/public/spider-stage/index.html?embed=finance-demo&retry='+Date.now();}loadObservatoryDemo()}
if(LANG==='en'){$('stageEmptyTitle').textContent='Spider stage unavailable';$('stageEmptyText').textContent=T.stageUnavailable;$('stageRetry').textContent=T.retry}
stage.addEventListener('load',stageLoaded);stage.addEventListener('error',stageLoaded);$('stageRetry').onclick=retry;stage.src='/public/spider-stage/index.html?embed=finance-demo&retry='+Date.now();loadObservatoryDemo();setInterval(loadObservatoryDemo,30000);
</script><script src="/app/back-to-top.js"></script>
</body></html>
