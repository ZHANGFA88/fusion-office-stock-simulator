['office','trade','markets','race','spider','observatory','settings'].forEach(k=>{const e=$('rn_'+k);if(e)e.textContent=T[k]});$('hsub').textContent=T.sub;$('hpaper').textContent=T.paper;$('pageTitle').textContent=T.page;$('title').textContent=T.title;$('lede').textContent=T.lede;$('demoBadge').textContent=T.demo;$('scanTitle').textContent=T.scan;$('topicTitle').textContent=T.topicTitle;$('hotTitle').textContent=T.hot;$('trendTitle').textContent=T.trend;$('trendNote').textContent=T.trendNote;$('sectorTitle').textContent=T.sector;$('sourcesTitle').textContent=T.sources;$('scanDisclaimer').textContent=T.scanDisclaimer;$('footerNote').textContent=T.footer;$('step1').textContent=T.step1;$('step2').textContent=T.step2;$('step3').textContent=T.step3;$('step4').textContent=T.step4;$('search').placeholder=T.search;$('search').setAttribute('aria-label',T.searchAria);$('sourceFilter').setAttribute('aria-label',T.sourceAria);$('topicFilter').setAttribute('aria-label',T.topicAria);$('sourceFilter').innerHTML=`<option value="">${T.sourceAll}</option>`;$('topicFilter').innerHTML=`<option value="">${T.topicAll}</option>`;$('langBtn').textContent=LANG==='zh'?'EN':'中文';$('langBtn').onclick=()=>{try{localStorage.setItem('office_lang',LANG==='zh'?'en':'zh')}catch(e){}location.href=location.pathname+'?lang='+(LANG==='zh'?'en':'zh')};
