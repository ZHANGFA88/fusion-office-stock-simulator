<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赛跑 · DCA Race</title>
<style>
:root{--pk:#ff4fb4;--card:#111116;--ln:#24242c;--txt:#ececf1;--mut:#8a8a99;--g:#3dff8f;--r:#ff4d5e;--y:#ffd23f;--c:#3fd5ff}
*{box-sizing:border-box}html,body{margin:0}
body{background:#e04aa6;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:6px 6px;color:var(--txt);font-family:ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;padding:10px 12px}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.hd .lg{width:34px;height:34px;border-radius:8px;background:#111;display:grid;place-items:center}
.hd h1{margin:0;font:900 26px/1 system-ui,sans-serif;color:#111}.hd .sub{font-size:11px;color:#2a0b1e;letter-spacing:1px}
.paper{background:#111;color:var(--y);font-size:10px;font-weight:900;padding:3px 7px;border-radius:4px;letter-spacing:1px}
#roomnav{display:flex;gap:4px;align-items:center;margin-left:10px}
#roomnav a{color:#2a0b1e;text-decoration:none;font:800 12px ui-monospace,monospace;padding:4px 9px;border:2px solid #111;border-radius:5px;letter-spacing:1px}
#roomnav a.on{background:#111;color:#ff4fb4}#roomnav a:hover{background:#111;color:#fff}
#langBtn{background:#111;color:#ffd23f;border:2px solid #111;border-radius:5px;font:800 12px ui-monospace,monospace;padding:4px 9px;cursor:pointer}
.hd .sp{flex:1}.hd .ttl{font:900 20px system-ui,sans-serif;color:#111}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:8px}
.pn{background:var(--card);border-radius:7px;padding:10px 12px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.pn .k{font-size:10px;color:var(--mut);letter-spacing:1.5px}.pn .v{font:900 22px ui-monospace,monospace;margin-top:3px}
.gold{color:#ffd98a}.cy{color:var(--c)}
.race-meta{font-size:11px;color:var(--mut);margin:0 2px 8px;letter-spacing:.4px}.race-meta b{color:var(--y)}
iframe{width:100%;height:76vh;border:0;border-radius:7px;background:#04060d;box-shadow:0 2px 0 rgba(0,0,0,.35)}
@media(max-width:768px){body{padding:8px}.hd{flex-wrap:wrap;gap:8px}.hd .sp{display:none}.hd .ttl{font-size:16px;margin-left:auto}#roomnav{order:10;flex:1 0 100%;width:100%;max-width:100%;margin:0;overflow-x:auto;white-space:nowrap;scrollbar-width:thin}#roomnav a,#langBtn{flex:none}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.pn{min-width:0}.pn .v{font-size:19px}iframe{height:65vh}}
@media(max-width:390px){body{padding:7px}.hd h1{font-size:22px}.hd .sub{font-size:9px;letter-spacing:.5px}.paper{font-size:9px}#roomnav{gap:3px}#roomnav a,#langBtn{font-size:11px;padding:4px 7px}.strip{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.pn{padding:8px}.pn .v{font-size:16px}iframe{height:58vh}}
</style></head><body>
<div class="hd"><div class="lg"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="#ff4fb4"/><rect x="6" y="8" width="3" height="4" fill="#111"/><rect x="13" y="8" width="3" height="4" fill="#111"/></svg></div>
<div><h1>GROKBOT + JEV</h1><div class="sub" id="hsub"></div></div><span class="paper" id="hpaper"></span>
<nav id="roomnav"><a href="index.html" id="rn_office"></a><a href="trade.html" id="rn_trade"></a><a href="markets.html" id="rn_markets"></a><a href="race.html" class="on" id="rn_race"></a><a href="spider.html" id="rn_spider"></a><a href="finance-observatory.html" id="rn_observatory"></a><a href="settings.html" id="rn_settings"></a><button id="langBtn"></button></nav>
<div class="sp"></div><div class="ttl" id="httl"></div></div>
<div class="strip" id="strip"></div>
<div class="race-meta" id="raceMeta" aria-live="polite">正在读取数据日期…</div>
<iframe src="/modules/race/index.html" title="race"></iframe>
<script>
const LANG=(()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q==='en'||q==='zh')return q}catch(e){}try{return localStorage.getItem('office_lang')||'zh'}catch(e){return'zh'}})();
const D={zh:{sub:'模拟股票桌面 · 行情与组合',paper:'📄 PAPER · 虚拟资金',office:'办公室',trade:'交易台',markets:'行情',race:'赛跑',spider:'蜘蛛',observatory:'财经观测台',settings:'设置',ttl:'定投赛跑放映室',final:'组合终值',ret:'组合收益',irr:'年化 IRR',mdd:'最大回撤',eq:'等分基准',per:'期数（月）'},
en:{sub:'PAPER STOCK DESK · MARKETS & PORTFOLIO',paper:'📄 PAPER · VIRTUAL MONEY',office:'Office',trade:'Trade Desk',markets:'Markets',race:'Race',spider:'Spider',observatory:'Observatory',settings:'Settings',ttl:'DCA RACE THEATER',final:'Final value',ret:'Portfolio return',irr:'IRR',mdd:'Max drawdown',eq:'Equal-weight',per:'Periods (months)'}};
const T=D[LANG];document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
const $=i=>document.getElementById(i);
const f2=(v,d=2)=>v==null||isNaN(v)?'—':(+v).toLocaleString(LANG==='zh'?'zh-CN':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
$('hsub').textContent=T.sub;$('hpaper').textContent=T.paper;$('httl').textContent=T.ttl;
['office','trade','markets','race','spider','observatory','settings'].forEach(k=>$('rn_'+k).textContent=T[k]);
$('langBtn').textContent=LANG==='zh'?'EN':'中文';$('langBtn').onclick=()=>{try{localStorage.setItem('office_lang',LANG==='zh'?'en':'zh')}catch(e){}location.href=location.pathname+'?lang='+(LANG==='zh'?'en':'zh')};
 fetch('/api/fusion/status').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(st=>{const r=st.race||{};const cell=(k,v,c)=>`<div class="pn"><div class="k">${k}</div><div class="v ${c||''}">${v}</div></div>`;
 $('strip').innerHTML=cell(T.final,'¥'+f2(r.final_value,0),'gold')+cell(T.ret,'+'+f2((r.port_ret||0)*100,2)+'%','gold')+cell(T.irr,f2((r.irr||0)*100,2)+'%','cy')+cell(T.mdd,f2((r.mdd||0)*100,1)+'%','')+cell(T.eq,'+'+f2((r.eq_ret||0)*100,2)+'%','')+cell(T.per,r.periods||'—','')}).catch(()=>{$('strip').innerHTML='<div class="pn mut" role="status">'+(LANG==='zh'?'总览暂不可用':'Summary unavailable')+'</div>'});
 fetch('/api/race/meta').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(m=>{$('raceMeta').innerHTML=(LANG==='zh'?'数据截至 ':'Data through ')+'<b>'+String(m.last_date||'—').replace(/[&<>"']/g,'')+'</b>'}).catch(()=>{$('raceMeta').textContent=LANG==='zh'?'数据日期暂不可用':'Data date unavailable'});
</script></body></html>
